<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quesómetro</title>
    
    <!-- Etiquetas para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quesómetro">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="manifest" href="manifest.json">

    <!-- Leaflet CSS para el mapa real -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --color-void: #000000;
            --color-bone-white: #ffffff;
            --color-ash-gray: #9a9a9a;
            --color-silver-mist: #bdbdbd;
            --color-electric-iris: #8052ff;
            --color-saffron-spark: #ffb829;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background-color: var(--color-void);
            color: var(--color-bone-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        .screen {
            display: none;
            width: 100%; height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: absolute; top: 0; left: 0;
        }

        .screen.active { display: flex; }
        
        .label-saffron {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-saffron-spark);
            letter-spacing: 0.035em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1.display-title {
            font-size: clamp(42px, 11vw, 88px);
            font-weight: 400;
            letter-spacing: -0.04em;
            line-height: 1.1;
            text-align: center;
            margin-bottom: 24px;
            color: var(--color-bone-white);
        }

        p.body-ultra {
            font-size: 18px;
            font-weight: 200;
            color: var(--color-silver-mist);
            text-align: center;
            max-width: 480px;
            line-height: 1.5;
            margin-bottom: 36px;
        }

        .btn-violet {
            background-color: var(--color-electric-iris);
            color: var(--color-bone-white);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            padding: 16px 32px;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            box-shadow: none;
            transition: opacity 0.2s ease;
        }

        .btn-violet:active { opacity: 0.8; }

        /* Animación de Radar con Quesos */
        .radar-container {
            position: relative;
            width: 260px; height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(128, 82, 255, 0.3);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 30px;
        }

        .radar-sweep {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(128, 82, 255, 0) 0deg, rgba(128, 82, 255, 0.45) 360deg);
            animation: spin 2s linear infinite;
        }

        .radar-cheese {
            position: absolute;
            font-size: 18px;
            animation: pulseCheese 1.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(255, 184, 41, 0.8));
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseCheese {
            from { transform: scale(0.8); opacity: 0.5; }
            to { transform: scale(1.2); opacity: 1; }
        }

        /* Contenedor del Mapa Real */
        #screen-3 {
            padding: 0;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: var(--color-void);
        }

        .map-header-overlay {
            position: absolute; top: 20px; left: 0; right: 0;
            text-align: center; z-index: 1000;
            pointer-events: none;
        }

        .cheese-modal {
            position: absolute; bottom: 30px; left: 24px; right: 24px;
            background: rgba(14, 14, 14, 0.95);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            display: none;
            z-index: 1001;
            border: 1px solid rgba(128, 82, 255, 0.25);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1: INICIO -->
    <div id="screen-1" class="screen active">
        <div class="label-saffron">Sistema Táctico Activo</div>
        <h1 class="display-title">QUESÓMETRO</h1>
        <p class="body-ultra">Detección de espectro lácteo de alta precisión en tiempo real sin calibración previa.</p>
        <button class="btn-violet" id="btn-start">Iniciar búsqueda</button>
    </div>

    <!-- PANTALLA 2: RADAR CON QUESOS -->
    <div id="screen-2" class="screen">
        <div class="label-saffron">Buscando frecuencias...</div>
        <div class="radar-container">
            <div class="radar-sweep"></div>
            <div class="radar-cheese" style="top: 25%; left: 70%;">🧀</div>
            <div class="radar-cheese" style="top: 75%; left: 35%;">🧀</div>
            <div class="radar-cheese" style="top: 40%; left: 20%;">🧀</div>
        </div>
        <p class="body-ultra" id="radar-status">Calibrando sensores de proximidad láctea...</p>
    </div>

    <!-- PANTALLA 3: MAPA REAL DE UBICACIÓN -->
    <div id="screen-3" class="screen">
        <div class="map-header-overlay">
            <div class="label-saffron" style="background: rgba(0,0,0,0.8); display: inline-block; padding: 6px 16px; border-radius: 9999px; border: 1px solid rgba(128,82,255,0.3);">Señales detectadas en tu ubicación</div>
        </div>
        
        <div id="map"></div>

        <!-- Modal de reporte de queso -->
        <div id="cheese-modal" class="cheese-modal">
            <div class="label-saffron" style="margin-bottom: 8px;">Nodo de Queso Analizado</div>
            <p id="cheese-text" style="font-size: 18px; color: var(--color-bone-white); margin-bottom: 20px; font-weight: 200;"></p>
            <button class="btn-violet" id="btn-close-modal" style="width: 100%;">Cerrar reporte</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const btnStart = document.getElementById('btn-start');
        const screen1 = document.getElementById('screen-1');
        const screen2 = document.getElementById('screen-2');
        const screen3 = document.getElementById('screen-3');
        const radarStatus = document.getElementById('radar-status');
        const cheeseModal = document.getElementById('cheese-modal');
        const cheeseText = document.getElementById('cheese-text');
        const btnCloseModal = document.getElementById('btn-close-modal');

        let map = null;

        const statusMessages = [
            "Analizando emisión gaseosa...",
            "Triangulando coordenadas GPS...",
            "Detectando concentración de caseína...",
            "Filtro de lactosa completado..."
        ];

        btnStart.addEventListener('click', () => {
            screen1.classList.remove('active');
            screen2.classList.add('active');

            let msgIndex = 0;
            const interval = setInterval(() => {
                msgIndex = (msgIndex + 1) % statusMessages.length;
                radarStatus.textContent = statusMessages[msgIndex];
            }, 1600);

            // Intentar pedir la geolocalización de inmediato para ganar tiempo
            let userLat = 40.9650; // Fallback Salamanca / centro genérico
            let userLon = -5.6640;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLon = position.coords.longitude;
                    },
                    (error) => {
                        console.log("Usando ubicación por defecto");
                    },
                    { timeout: 5000 }
                );
            }

            // Tras 6.5 segundos, pasar al mapa real
            setTimeout(() => {
                clearInterval(interval);
                screen2.classList.remove('active');
                screen3.classList.add('active');

                // Inicializar mapa de Leaflet con estilo oscuro CartoDB (estética Dala)
                if (!map) {
                    map = L.map('map', {
                        zoomControl: false,
                        attributionControl: false
                    }).setView([userLat, userLon], 16);

                    // Capa de mapa oscuro para encajar con el vacío negro
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        maxZoom: 19,
                    }).addTo(map);

                    // Icono personalizado para los quesos en el mapa
                    const cheeseIcon = L.divIcon({
                        className: 'custom-cheese-marker',
                        html: '<div style="font-size: 26px; filter: drop-shadow(0 0 10px rgba(255, 184, 41, 0.7));">🧀</div>',
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    // Mensajes de broma para los nodos de queso cercanos
                    const messages = [
                        "Concentración sospechosa de Cheddar envejecido muy cerca de ti.",
                        "Alerta máxima: Queso fresco sin sellar detectado en este edificio.",
                        "Señal débil de Mozzarella. Posible rastro de pizza reciente.",
                        "¡Atención! Este nodo emite una cantidad anómala de aroma a Cabrales."
                    ];

                    // Añadir varios quesos aleatorios alrededor de la posición real (desplazamientos pequeños)
                    const offsets = [
                        { lat: 0.0012, lon: 0.0010, msg: 0 },
                        { lat: -0.0015, lon: -0.0012, msg: 1 },
                        { lat: 0.0008, lon: -0.0018, msg: 2 },
                        { lat: -0.0010, lon: 0.0015, msg: 3 }
                    ];

                    offsets.forEach(offset => {
                        const marker = L.marker([userLat + offset.lat, userLon + offset.lon], { icon: cheeseIcon }).addTo(map);
                        marker.on('click', () => {
                            cheeseText.textContent = messages[offset.msg];
                            cheeseModal.style.display = 'block';
                        });
                    });

                    // Punto central de la víctima (usuario)
                    const userIcon = L.divIcon({
                        className: 'user-marker',
                        html: '<div style="width: 14px; height: 14px; background-color: #8052ff; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 15px #8052ff;"></div>',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    });
                    L.marker([userLat, userLon], { icon: userIcon }).addTo(map);
                } else {
                    map.invalidateSize();
                }
            }, 6500);
        });

        btnCloseModal.addEventListener('click', () => {
            cheeseModal.style.display = 'none';
        });
    </script>
</body>
</html>
